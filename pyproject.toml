#:schema ./__pyronaut__/schemas/pyronaut-pyproject.schema.json
# Generated by pyronaut-install for Pyronaut TOML schema support.

[project]
name = "micronaut-deep-data-security-pyronaut-demo"
version = "0.1.0"
description = "Pyronaut port of the Oracle Deep Data Security sample application (Micronaut, Entra ID, Oracle JDBC extensions)."
dynamic = [
    "scripts",
]

[build-system]
requires = [
    "setuptools",
    "wheel",
    "tomli",
]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = [
    "src",
]

[tool.pyronaut]
repositories = [
    "mavenCentral",
]

[tool.pyronaut.core]
version = "5.2.14"

[tool.pyronaut.platform]
version = "5.2.1"

[tool.pyronaut.toolchain]
type = "jvm"

[tool.pyronaut.sources]
python = "src"
python-test = "tests"
resources = "config"
test-resources = "tests-config"

[tool.pyronaut.processor]
incremental = true
daemon = true
python-incremental-mode = "optimistic"

[tool.pyronaut.ide-stubs]
packages = [
    "io.micronaut",
    "jakarta",
]

[tool.pyronaut.validation]
enabled = true

[tool.pyronaut.test-resources]
enabled = false
infer-classpath = false

[tool.pyronaut.dependencies]
runtime = [
    # Logging
    "io.micronaut.pyronaut:micronaut-pyronaut-logback",
    # Serialization
    "io.micronaut.serde:micronaut-serde-jackson",
    # HTTP server and client (the OJDBC extensions need an HTTP client implementation)
    "io.micronaut:micronaut-http-server-netty",
    "io.micronaut:micronaut-http-client",
    # Views
    "io.micronaut.views:micronaut-views-thymeleaf",
    # Micronaut Data JDBC
    "io.micronaut.data:micronaut-data-jdbc",
    # Connection pool
    "io.micronaut.sql:micronaut-jdbc-hikari",
    # Oracle driver
    "com.oracle.database.jdbc:ojdbc11",
    # Oracle Wallet/SSL jars for TCPS
    "com.oracle.database.security:oraclepki:23.26.3.0.0",
    # Azure token provider for JDBC
    "com.oracle.database.jdbc:ojdbc-provider-azure:1.1.0",
    "com.azure:azure-core-http-jdk-httpclient",
    # Security
    "io.micronaut.security:micronaut-security-ojdbc-extensions",
    "io.micronaut.security:micronaut-security-jwt",
    "io.micronaut.security:micronaut-security-oauth2",
]
# The Azure SDK pulls in its own Netty-based HTTP client, which conflicts with
# the Netty version shipped by Micronaut. The JDK HTTP client is used instead.
exclusions = [
    "com.azure:azure-core-http-netty",
]
build = [
    "io.micronaut.serde:micronaut-serde-processor",
    "io.micronaut:micronaut-http-validation",
    "io.micronaut.data:micronaut-data-processor",
    "io.micronaut.security:micronaut-security-processor",
    "io.micronaut.security:micronaut-security-annotations",
]
test = [
    "io.micronaut.pyronaut:micronaut-pyronaut-pytest",
    "io.micronaut.pyronaut:micronaut-pyronaut-requests",
    "io.micronaut:micronaut-http-client",
    "org.testcontainers:testcontainers-oracle-free",
]
