#:schema ../__pyronaut__/schemas/micronaut-application.schema.json
# Generated by pyronaut-install for Pyronaut TOML schema support.

[micronaut.application]
name = 'micronaut-deep-data-security-pyronaut-demo'

[micronaut.server]
port = 3000

# Datasource
[datasources.default]
db-type = 'oracle'
dialect = 'ORACLE'
driver-class-name = 'oracle.jdbc.OracleDriver'
schema-generate = 'NONE'

# Security
[micronaut.security.endpoints.logout]
get-allowed = true
